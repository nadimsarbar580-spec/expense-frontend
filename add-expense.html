<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Expense</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <span class="logo">💸 ExpenseTracker</span>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="add-expense.html">Add Expense</a>
    </div>
  </nav>

  <main>
    <h1>Add New Expense</h1>
    <div class="form-container">
      <input type="text" id="title" placeholder="Expense title (e.g. Lunch)" />
      <input type="number" id="amount" placeholder="Amount (₹)" />
      <select id="category">
        <option value="">-- Select Category --</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Shopping">Shopping</option>
        <option value="Health">Health</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
      <button id="submit-btn">Add Expense</button>
      <p id="message"></p>
    </div>
  </main>

  <script src="add-expense.js"></script>
</body>
</html>
